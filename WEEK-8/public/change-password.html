<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BST Bank | Change Password</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="form-page">
<nav class="navbar">
  <div class="brand">BST <span>BANK</span></div>
  <div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="profile.html">Profile</a><button id="logoutBtn" class="logout-btn">Logout</button></div>
</nav>
<div class="login-box">
  <h1>Change Password</h1>
  <p class="muted">Update your BST Bank login password.</p>
  <div id="message"></div>
  <form id="passwordForm">
    <label>Current Password<input type="password" name="currentPassword" required></label>
    <label>New Password<input type="password" name="newPassword" minlength="8" required></label>
    <label>Confirm New Password<input type="password" name="confirmPassword" minlength="8" required></label>
    <button class="btn primary full" type="submit">Change Password</button>
  </form>
</div>
<script src="js/change-password.js"></script>
</body>
</html>
